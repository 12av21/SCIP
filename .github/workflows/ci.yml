name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci || npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Security smoke tests (isolated temp DB)
        run: npm run test:security
        env:
          NODE_ENV: test
          SCIP_DB_PATH: /tmp/scip-ci-isolated.json
          JWT_SECRET: ci-test-jwt-secret-at-least-32-chars-long

      - name: Security HTTP integration tests (isolated temp DB)
        run: npm run test:security:http
        env:
          NODE_ENV: test
          SCIP_DB_PATH: /tmp/scip-ci-isolated-http.json
          JWT_SECRET: ci-test-jwt-secret-at-least-32-chars-long
          DISABLE_RATE_LIMIT: "true"

      - name: Dependency audit (production)
        run: npm audit --omit=dev
