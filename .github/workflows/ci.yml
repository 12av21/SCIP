name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  NODE_ENV: test
  JWT_SECRET: test-jwt-secret-for-ci-isolated-12345678901234567890
  DATABASE_DRIVER: json
  DISABLE_RATE_LIMIT: 'true'
  DISABLE_HMR: 'true'

jobs:
  lint-and-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript typecheck
        run: npm run typecheck

  build:
    name: Production Build
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Vite production build
        run: npm run build

  security-tests:
    name: Security Tests
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run security smoke tests
        run: npx tsx scripts/security-smoke-test.mts

      - name: Run security HTTP tests
        run: npx tsx scripts/security-http-test.mts

  ai-tests:
    name: AI Verification Tests
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run AI model registry tests
        run: npx tsx scripts/ai-model-registry-test.mts

      - name: Run AI dataset tests
        run: npx tsx scripts/ai-dataset-test.mts

      - name: Run AI image intelligence tests
        run: npx tsx scripts/ai-image-test.mts

      - name: Run AI India civic intelligence tests
        run: npx tsx scripts/ai-india-civic-test.mts

      - name: Run AI verification tests
        run: npx tsx scripts/ai-verification-test.mts

      - name: Run database management tests
        run: npx tsx scripts/db-management-test.mts

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build web image
        run: docker build -t scip-platform .

      - name: Build AI service image
        run: docker build -t scip-ai ./ai_service

  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        run: npm audit --omit=dev || true
