version: '3.8'

services:
  scip-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: scip-platform
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - JWT_SECRET=${JWT_SECRET:?Set a strong JWT_SECRET (>=32 chars) before starting}
      - DATABASE_DRIVER=json
      - AI_SERVICE_URL=http://scip-ai:8000
      - AI_SERVICE_ENABLED=false
    # MongoDB and AI service are optional fallbacks; JSON backend is the production default.
    # AI_SERVICE_ENABLED=false keeps the TypeScript engine as the sole runtime path;
    # set to true to route supported capabilities to the Python scip-ai service.
    # Node.js does not require scip-ai to start (no hard depends_on).
    # Do not set MONGODB_URI in production: MongoDB runtime is gated (non-production, isolated
    # localhost URI, explicit SCIP_MONGO_RUNTIME_INTEGRATED=true) and DATABASE_DRIVER=json is required.
    volumes:
      - scip_data:/app/data
    restart: unless-stopped

  scip-mongo:
    image: mongo:7-jammy
    container_name: scip-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

  scip-ai:
    build:
      context: ./ai_service
      dockerfile: Dockerfile
    container_name: scip-ai-engine
    ports:
      - "8000:8000"
    restart: unless-stopped

volumes:
  scip_data:
  mongo_data:
